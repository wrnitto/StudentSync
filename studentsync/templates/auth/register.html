{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Create your account</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Name</label>
    <input id="name" name="name" value="{{ form.name }}" autocomplete="name" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ form.email }}" autocomplete="email" required>

    <label for="password">Password <small>(at least 8 characters)</small></label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>

    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
