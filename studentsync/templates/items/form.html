{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'Add' }} item{% endblock %}
{% block content %}
<section class="card form-card">
  <h1>{% if item %}Edit "{{ item['title'] }}"{% else %}Add an assignment or event{% endif %}</h1>
  <form method="post" action="{{ url_for('items.edit', item_id=item['id']) if item else url_for('items.create') }}">
    {% include "items/_fields.html" %}
    <div class="actions">
      <button type="submit" class="btn btn-primary">{{ 'Save changes' if item else 'Add' }}</button>
      <a href="{{ url_for('items.dashboard') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
